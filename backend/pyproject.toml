[project]
name = "analytical-backend"
version = "0.1.0"
description = "Analytical — analytical decision-support for NSE markets (backend)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Pinned per Phase 0 decisions (docs/02 §4, §8). Dependency manager: uv.
#   uv sync            # create .venv and install everything (incl. dev)
#   uv run pytest      # run the test suite
dependencies = [
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "structlog==24.4.0",
    "apscheduler==3.11.0",
    "pyyaml==6.0.2",
    # Runtime HTTP client for the real provider adapter (Phase 2.3). Promoted
    # from dev on the first real provider HTTP call.
    "httpx==0.28.1",
    # Swiss Ephemeris binding for the astro cross-check module (docs/13). The
    # maintained fork of pyswisseph — same `import swisseph`, ships a py3.13
    # wheel. AGPL-3.0 (fine for internal/non-distributed use).
    "pysweph==2.10.3.6",
    # Streaming: Upstox Market Data Feed v3 (Phase S3, decision 3.1). protobuf
    # decodes the feed frames (MarketDataFeed_pb2.py is generated & committed);
    # websockets is the sync WS client. Owner sign-off 2026-08-31.
    "protobuf==5.29.6",
    "websockets>=13,<18",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "black==24.10.0",
    "mypy==1.13.0",
]

[project.scripts]
analytical-gate = "app.providers.validation.gate:main"
analytical-worker = "app.worker.cli:main"
analytical-seed = "app.db.seed:main"
analytical-db = "app.db.commands:main"
analytical-provider = "app.providers.upstox.cli:main"
analytical-instruments = "app.instruments.cli:main"
analytical-backfill = "app.ingestion.cli:main"
analytical-astro = "app.astro.cli:main"
analytical-index-weights = "app.indices.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analytical_core", "app"]

[tool.uv]
# dev extras installed by default with `uv sync`
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "db: test requires a live PostgreSQL (set TEST_DATABASE_URL); skipped otherwise",
    "api: exercises the FastAPI app in-process (no DB needed)",
]
filterwarnings = ["error::DeprecationWarning:analytical_core.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# generated protobuf code (Upstox market-data-feed v3) is committed as-is
extend-exclude = ["*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# raw SQL string literals in DB tests are clearer unwrapped
"tests/**" = ["E501"]
# FastAPI's dependency-injection idiom is `= Depends(...)` in the signature
"app/api/routers/**" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = ".*_pb2\\.py"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["analytical_core", "app"]
exclude = ["_pb2\\.py$"]
